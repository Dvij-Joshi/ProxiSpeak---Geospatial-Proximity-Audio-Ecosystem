services:
  - type: web
    name: proxispeak-server
    branch: main
    runtime: node
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://proxi-speak-geospatial-proximity-au-kappa.vercel.app
      - key: SERVER_URL
        value: https://proxispeak-server-sgwp.onrender.com
      - key: MONGODB_URI
        sync: false

  - type: web
    name: proxispeak-server-dev
    branch: dev
    runtime: node
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://proxi-speak-geospatial-proximity-au-kappa.vercel.app
      - key: SERVER_URL
        value: https://proxispeak-server-dev.onrender.com
      - key: MONGODB_URI
        sync: false
